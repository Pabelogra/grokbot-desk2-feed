<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Desk">
  <title>Desk</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <div id="lock" class="screen hidden">
      <div class="lock-card">
        <h1>Desk</h1>
        <p>Open the private desk link to load your feed. The path and key stay in this device’s localStorage and never go back to the server.</p>
      </div>
    </div>
    <div id="shell" class="hidden">
      <header id="header" class="topbar"></header>
      <main id="main"></main>
      <nav id="tabs" class="tabbar" aria-label="Tabs">
        <button data-tab="home" class="on">Home</button>
        <button data-tab="activity">Activity</button>
        <button data-tab="account">Account</button>
      </nav>
    </div>
  </div>
  <script src="chart.js"></script>
  <script src="app.js"></script>
</body>
</html>
